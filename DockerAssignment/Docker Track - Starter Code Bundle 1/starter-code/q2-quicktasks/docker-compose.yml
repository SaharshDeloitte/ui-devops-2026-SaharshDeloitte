services:
  redis:
    image: redis:7-alpine
    container_name: quicktasks-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    volumes:
      - redis_data:/data
    networks:
      - quicktasks_net

  app:
    build: .
    container_name: quicktasks-app
    env_file:
      - .env
    ports:
      - "5000:5000"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - quicktasks_net

volumes:
  redis_data:

networks:
  quicktasks_net:
    driver: bridge