# Starter NGINX reverse-proxy config for Assignment Question 5.
#
# "api" below is expected to resolve to your Flask service by its Docker
# Compose service name. Docker's embedded DNS server (127.0.0.11 inside
# any container on a user-defined network) will return the IP address(es)
# of whatever "api" containers currently exist -- but plain NGINX only
# resolves that hostname once, when it starts. That is fine the moment
# you bring the stack up, but think carefully about what happens to this
# config when a container behind "api" is later replaced with a new one
# at a different IP, while NGINX keeps running.

events {}

http {
    upstream greeting_api {
        server api:5000;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://greeting_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
